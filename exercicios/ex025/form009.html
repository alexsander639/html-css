<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <h1>Exemplo de Formulários</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <p>
            <label for="inum">Número: </label>
            <input type="range" name="num" id="inum" min="0" max="10" value="0" oninput="inumsel.innerHTML = Number(inum.value)">
        </p>
        <p>
            <label for="inumsel">Número selecionado: </label>
            <output id="inumsel">0</output>
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar" onclick="inumsel.innerHTML = Number(0)">
        </p>
    </form>
</body>
</html>
