<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex box</title>
    <style>
        div.container{
            background-color: rgb(168, 234, 168);
            height: 300px;

            display: flex;
            flex-flow: row wrap;
            align-items: flex-start;
        }

        div.item{
            background-color: lightpink;
            border: 1px solid purple;
            text-align: center;
            margin: 5px;
            padding: 20px;
        }

        div#i1{
            align-self: auto;
        }

        div#i2{
            align-self: flex-start;
        }

        div#i3{
            align-self: flex-end;
        }

        div#i4{
            align-self: center;
        }

        div#i5{
            align-self: stretch;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="i1">A</div>
        <div class="item" id="i2">B</div>
        <div class="item" id="i3">C</div>
        <div class="item" id="i4">D</div>
        <div class="item" id="i5">E</div>
    </div>
</body>
</html>
