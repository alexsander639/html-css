<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex box</title>
    <style>
        div.container{
            background-color: rgb(168, 234, 168);

            display: flex;
            flex-flow: row nowrap;
        }

        div.item{
            background-color: lightpink;
            border: 1px solid purple;
            text-align: center;
            margin: 5px;
            padding: 5px;
            
            flex-basis: 150px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">Um conteúdo</div>
        <div class="item">C</div>
        <div class="item">Outro conteúdo maior</div>
        <div class="item">Outro conteúdo maior que todos os outros</div>
        <div class="item">F</div>
    </div>
</body>
</html>
